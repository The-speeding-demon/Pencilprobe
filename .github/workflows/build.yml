name: Build apps

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: |
          xcodebuild build \
            -project PencilProbe.xcodeproj \
            -target PencilProbe \
            -configuration Release \
            -sdk iphoneos \
            SYMROOT="$PWD/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package IPA
        run: |
          mkdir Payload
          cp -R build/Release-iphoneos/PencilProbe.app Payload/
          zip -qr PencilProbe.ipa Payload

      - name: Build Mac scanner
        run: |
          xcodebuild build \
            -project PencilScan.xcodeproj \
            -target PencilScan \
            -configuration Release \
            SYMROOT="$PWD/build-mac"
          ditto -c -k --keepParent build-mac/Release/PencilScan.app PencilScan-mac.zip

      - uses: actions/upload-artifact@v4
        with:
          name: PencilProbe
          path: |
            PencilProbe.ipa
            PencilScan-mac.zip

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" PencilProbe.ipa PencilScan-mac.zip \
            --target "${{ github.sha }}" \
            --title "Build ${{ github.run_number }}" \
            --notes "PencilProbe.ipa: unsigned iPhone app that logs Apple Pencil events. PencilScan-mac.zip: Mac Bluetooth scanner that reads whatever a nearby device exposes."
