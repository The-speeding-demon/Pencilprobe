name: Build unsigned IPA

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: |
          xcodebuild build \
            -project PencilProbe.xcodeproj \
            -target PencilProbe \
            -configuration Release \
            -sdk iphoneos \
            SYMROOT="$PWD/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package IPA
        run: |
          mkdir Payload
          cp -R build/Release-iphoneos/PencilProbe.app Payload/
          zip -qr PencilProbe.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: PencilProbe
          path: PencilProbe.ipa
