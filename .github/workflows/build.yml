name: Build unsigned IPA

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: |
          xcodebuild build \
            -project PencilProbe.xcodeproj \
            -target PencilProbe \
            -configuration Release \
            -sdk iphoneos \
            SYMROOT="$PWD/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package IPA
        run: |
          mkdir Payload
          cp -R build/Release-iphoneos/PencilProbe.app Payload/
          zip -qr PencilProbe.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: PencilProbe
          path: PencilProbe.ipa

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" PencilProbe.ipa \
            --target "${{ github.sha }}" \
            --title "PencilProbe build ${{ github.run_number }}" \
            --notes "Unsigned IPA for sideloading. Logs any Apple Pencil gestures, touches and hover events the app receives."
